name: Ansible Lint
on:
  pull_request:
    paths: ["ansible/**", ".github/workflows/ansible-lint.yml"]
  push:
    branches: [main]
    paths: ["ansible/**", ".github/workflows/ansible-lint.yml"]

permissions: # Least-privilege default
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true # lint only, nothing to leave half-done

jobs:
  ansible-lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # upload SARIF
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run ansible-lint
        uses: ansible/ansible-lint@b74fb6f73d234bf92672372cb1c10768e4018d16 # v26.11.0
        with:
          working_directory: ansible
          requirements_file: requirements.yml
          args: --sarif-file ansible-lint.sarif

      - name: Upload ansible-lint SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: ansible/ansible-lint.sarif
          category: ansible-lint
