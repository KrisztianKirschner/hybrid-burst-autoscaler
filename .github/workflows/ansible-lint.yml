name: Ansible Lint
on:
  pull_request:
    paths: ["ansible/**", ".github/workflows/ansible-lint.yml"]
  push:
    branches: [main]
    paths: ["ansible/**", ".github/workflows/ansible-lint.yml"]

permissions: # Least-privilege default
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true # lint only, nothing to leave half-done

jobs:
  ansible-lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # upload SARIF
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run ansible-lint
        uses: ansible/ansible-lint@9bce2bfb8f4a984e6b13767bc0d6bf0a49492164 # v26.10.1
        with:
          working_directory: ansible
          requirements_file: requirements.yml
          args: --sarif-file ansible-lint.sarif

      - name: Upload ansible-lint SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: ansible/ansible-lint.sarif
          category: ansible-lint
