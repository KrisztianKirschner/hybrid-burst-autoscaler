name: Terraform Proxmox Pipeline
on:
  pull_request:
    paths: ["terraform/proxmox/**", ".github/workflows/terraform-proxmox.yml"]
  push:
    branches: [main]
    paths: ["terraform/proxmox/**", ".github/workflows/terraform-proxmox.yml"]

permissions:
  contents: read

# one run per ref at a time; never cancel a run that may be mid-apply
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

# Set environment variables for Terraform automation
env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"

jobs:
  terraform-plan:
    # Push to main, or PRs from this repo only (fork PRs get no secrets)
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ['self-hosted']
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.TERRAFORM_STATE_AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.TERRAFORM_STATE_AWS_SECRET_ACCESS_KEY }}
      TF_VAR_PROXMOX_ENDPOINT: ${{ secrets.PROXMOX_ENDPOINT }}
      TF_VAR_PROXMOX_API_TOKEN: ${{ secrets.PROXMOX_API_TOKEN }}
      TF_VAR_ssh_public_key: ${{ vars.SSH_PUBLIC_KEY }}

    defaults:
      run:
        working-directory: terraform/proxmox
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false
          
      - run: terraform init
      - run: terraform plan -lock-timeout=5m -no-color

  terraform-apply:
    # Only after merge to main, and only once the plan above succeeded
    needs: terraform-plan
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ['self-hosted']
    # Pauses for required-reviewer approval
    environment: proxmox
    concurrency:
      group: terraform-proxmox-apply
      cancel-in-progress: false
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.TERRAFORM_STATE_AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.TERRAFORM_STATE_AWS_SECRET_ACCESS_KEY }}
      TF_VAR_PROXMOX_ENDPOINT: ${{ secrets.PROXMOX_ENDPOINT }}
      TF_VAR_PROXMOX_API_TOKEN: ${{ secrets.PROXMOX_API_TOKEN }}
      TF_VAR_ssh_public_key: ${{ vars.SSH_PUBLIC_KEY }}
    defaults:
      run:
        working-directory: terraform/proxmox
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false

      - run: terraform init
      - run: terraform plan -lock-timeout=5m -no-color -out=tfplan
      - run: terraform apply -lock-timeout=5m -no-color tfplan
      
      # Clean up the plan file after apply, even if the apply fails
      - if: always()
        run: rm -f tfplan
