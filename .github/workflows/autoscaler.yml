name: Autoscaler build
on:
  pull_request:
    paths: ["autoscaler/swarm/**", ".github/workflows/autoscaler.yml"]
  push:
    branches: [main]
    paths: ["autoscaler/swarm/**", ".github/workflows/autoscaler.yml"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Same flow as the app images (app.yml): PRs build only, main builds and pushes a sha-<commit> tag
  image:
    if: github.event_name != 'pull_request' || github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    env:
      IMAGE: ghcr.io/krisztiankirschner/hba-autoscaler
    permissions:
      contents: read
      packages: write   # push to GHCR
      pull-requests: write   # Scout PR comment
      security-events: write   # upload SARIF to code scanning
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Cheap check before the image build: syntax errors fail here, not at container start
      - name: Syntax check
        run: python3 -m py_compile autoscaler/swarm/controller.py

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The base images are Docker Hardened Images (dhi.io), which need a Docker Hub login to pull
      - name: Log in to dhi.io
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: dhi.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Image tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: autoscaler/swarm
          platforms: linux/amd64
          push: ${{ github.event_name == 'push' }}          # PRs: build only; main: build + push
          load: ${{ github.event_name == 'pull_request' }}  # PRs: keep image locally for Scout
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=autoscaler
          cache-to: type=gha,mode=max,scope=autoscaler

      - name: Docker Scout
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        uses: docker/scout-action@221e7f4860634eeb1579e3bd7ca232e577bd1864 # v1.26.0
        with:
          command: cves
          # PRs: image only loaded locally; main: image was pushed to GHCR
          image: ${{ github.event_name == 'pull_request' && format('local://{0}', steps.meta.outputs.tags) || steps.meta.outputs.tags }}
          only-severities: critical,high
          exit-code: false
          sarif-file: scout.sarif
          write-comment: ${{ github.event_name == 'pull_request' }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          dockerhub-user: ${{ secrets.DOCKERHUB_USERNAME }}
          dockerhub-password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Upload Scout SARIF
        if: hashFiles('scout.sarif') != ''
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: scout.sarif
          category: scout-hba-autoscaler

  # After a push on main: open (or update) the PR that points the stack at the new tag
  bump:
    needs: image
    if: github.event_name == 'push'
    permissions:
      contents: write
      pull-requests: write
    uses: ./.github/workflows/bump-image.yml
    with:
      image: hba-autoscaler
      file: stacks/swarm/autoscaler.yml
