name: Terraform Scan
on:
  pull_request:
    paths: ["terraform/**", ".github/workflows/terraform-scan.yml"]
  push:
    branches: [main]
    paths: ["terraform/**", ".github/workflows/terraform-scan.yml"]

permissions: # Least-privilege default
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  terraform-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # upload SARIF
    strategy: # One root per provider
      fail-fast: false
      matrix:
        root: [proxmox]
    defaults:
      run:
        working-directory: terraform/${{ matrix.root }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false

      - name: Terraform init
        run: terraform init -backend=false -input=false

      - name: Terraform fmt check
        run: terraform fmt -check -recursive

      - name: Terraform validate
        run: terraform validate

      - name: Tflint Install 
        uses: terraform-linters/setup-tflint@1cf010d3c7aef302051ccdb68c14c5dc2efa34ef # v6.3.1

      - name: Tflint scan
        id: tflint
        continue-on-error: true
        working-directory: .
        run: tflint --recursive --chdir=terraform/${{ matrix.root }} --format sarif > tflint.sarif

      - name: Upload tflint SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        with:
          sarif_file: tflint.sarif
          category: tflint-${{ matrix.root }}

      - name: Fail on tflint findings
        if: steps.tflint.outcome == 'failure'
        run: exit 1
