services:
  api:
    image: ghcr.io/krisztiankirschner/hba-api:sha-72f97f5
    ports:
      - "8080:8080"
    networks:
      - hba
    deploy:
      replicas: 1
      placement:
        constraints: ["node.role == manager"]

  worker:
    image: ghcr.io/krisztiankirschner/hba-worker:sha-5de4c05
    networks:
      - hba
    environment:
      HBA_S3_BUCKET: hybrid-burst-data
      # Swarm template, filled per task: burst-* nodes switch the worker to S3 (HBA_TIER=auto)
      HBA_NODE_NAME: "{{.Node.Hostname}}"
      HBA_S3_ENDPOINT_ONPREM: http://10.0.20.30:9000   # RustFS on obs-01
      # Swarm secrets are files only, hence the _FILE form
      HBA_S3_ACCESS_KEY_FILE: /run/secrets/rustfs_access_key
      HBA_S3_SECRET_KEY_FILE: /run/secrets/rustfs_secret_key
    secrets:
      - rustfs_access_key
      - rustfs_secret_key
    # Longer than one job + HBA_SHUTDOWN_TIMEOUT_SECONDS (25 s); Swarm's default 10 s kills jobs mid-way
    stop_grace_period: 30s
    # The image's HEALTHCHECK runs inside the 1-CPU limit every 30 s; K8s ignores it (no
    # livenessProbe there either), so it stays off here to keep both orchestrators equal
    healthcheck:
      disable: true
    deploy:
      replicas: 1
      placement:
        constraints: ["node.role == worker"]
      # 1 replica = 1 vCPU (single-threaded worker). The reservation makes Swarm leave
      # tasks Pending when the nodes are full instead of oversubscribing them
      resources:
        limits:
          cpus: "1"
        reservations:
          cpus: "1"

  redis:
    image: redis:8.8.3-alpine
    networks:
      - hba
    deploy:
      replicas: 1
      placement:
        constraints: ["node.role == manager"]

networks:
  hba:
    driver: overlay

# Created by the stacks Ansible role from RUSTFS_ACCESS_KEY / RUSTFS_SECRET_KEY
secrets:
  rustfs_access_key:
    external: true
  rustfs_secret_key:
    external: true
