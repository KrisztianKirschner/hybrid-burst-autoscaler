services:
  api:
    image: ghcr.io/krisztiankirschner/hba-api:sha-6a0d8f9
    ports:
      - "8080:8080"
    networks:
      - hba
    deploy:
      replicas: 1
      placement:
        constraints: ["node.role == manager"]

  redis:
    image: redis:8.8.3-alpine
    networks:
      - hba
    deploy:
      replicas: 1
      placement:
        constraints: ["node.role == manager"]

networks:
  hba:
    driver: overlay
