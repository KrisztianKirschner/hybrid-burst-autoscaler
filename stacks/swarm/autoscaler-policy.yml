# Swarm autoscaler policy (autoscaler/swarm/controller.py), mounted as a Swarm config.
# Deployed by the stacks role; a changed file gets a new config name and restarts the controller.
service: hba_worker
prometheus_url: http://10.0.20.30:9090
query: 'redis_key_size{key="hba:jobs"}'
jobs_per_replica: 5        # tune after preset calibration
min_replicas: 1
max_replicas: 10           # burst runs: 6 on-prem (3 nodes × 2) + 2 burst nodes × 2. On-prem-only runs: 6
# Times in seconds (plain numbers, no "s")
poll_interval: 5
scale_up_cooldown: 15
scale_down_cooldown: 60
scale_down_stabilization: 300
