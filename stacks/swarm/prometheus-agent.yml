# https://prometheus.io/docs/prometheus/latest/configuration/configuration/
# https://prometheus.io/docs/prometheus/latest/prometheus_agent/
global:
  scrape_interval: 5s
  # Lets dashboards tell Swarm runs from Kubernetes runs
  external_labels:
    cluster: swarm

remote_write:
  - url: http://10.0.20.30:9090/api/v1/write

scrape_configs:
  # Queue depth: redis_key_size{key="hba:jobs"}
  - job_name: redis
    static_configs:
      - targets: ["redis-exporter:9121"]

  # One target per running worker task, on its overlay address
  # https://prometheus.io/docs/guides/dockerswarm/
  # https://prometheus.io/docs/prometheus/latest/configuration/configuration/#dockerswarm_sd_config
  - job_name: worker
    dockerswarm_sd_configs:
      - host: unix:///var/run/docker.sock
        role: tasks
        port: 8080   # worker /metrics
    relabel_configs:
      - source_labels: [__meta_dockerswarm_service_name]
        regex: hba_worker
        action: keep
      # Only keep containers that should be running.
      - source_labels: [__meta_dockerswarm_task_desired_state]
        regex: running
        action: keep
      # A task has one address per network; only the overlay one is reachable
      - source_labels: [__meta_dockerswarm_network_name]
        regex: hba_hba
        action: keep
      # Which node the task runs on, for the 2-per-node placement check
      - source_labels: [__meta_dockerswarm_node_hostname]
        target_label: node
