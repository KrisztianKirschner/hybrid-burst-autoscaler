# Local development stack: Redis, RustFS (S3-compatible, stands in for the on-prem store),
# the API and one worker on one machine. Developer use only: not deployed, not used by CI,
# and the credentials below are throwaway dev values.
#
#   1. Put a few JPEG/PNG photos in app/dev-images/ (git-ignored). File names must match the
#      input_key rule: lowercase letters, digits and dashes, e.g. img-01.jpg.
#   2. docker login dhi.io          (Dockerfile.api builds from Docker Hardened Images)
#   3. docker compose -f docker-compose.dev.yml up --build
#   4. curl -i -X POST localhost:8080/jobs -H "Content-Type: application/json" \
#           -d '{"input_key":"src/img-01.jpg","preset":"small"}'
#      curl localhost:8080/jobs/<job_id>
#
# RustFS console: http://localhost:9001 (rustfsadmin / rustfsadmin). API docs: http://localhost:8080/scalar
name: hba-dev

services:
  redis:
    image: redis:8.8.3-alpine          # same version as stacks/swarm/hba.yml
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # RustFS runs as UID/GID 10001; a fresh named volume is owned by root.
  rustfs-permissions:
    image: alpine:3.24.2
    volumes:
      - rustfs-data:/data
    command: ["chown", "-R", "10001:10001", "/data"]
    restart: "no"

  rustfs:
    image: rustfs/rustfs:1.0.1
    depends_on:
      rustfs-permissions:
        condition: service_completed_successfully
    environment:
      RUSTFS_ACCESS_KEY: rustfsadmin
      RUSTFS_SECRET_KEY: rustfsadmin
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      RUSTFS_CONSOLE_ENABLE: "true"
    volumes:
      - rustfs-data:/data
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # web console
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/health"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  # One-off: create the bucket and upload app/dev-images/ to src/. Safe to re-run.
  s3-seed:
    image: amazon/aws-cli:2.37.11
    depends_on:
      rustfs:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: rustfsadmin
      AWS_SECRET_ACCESS_KEY: rustfsadmin
      AWS_DEFAULT_REGION: us-east-1
      AWS_ENDPOINT_URL: http://rustfs:9000
      # Skip the CLI's default upload checksums unless an operation requires them; not every
      # S3-compatible store accepts them.
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
    volumes:
      - ./dev-images:/seed:ro
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        aws configure set default.s3.addressing_style path
        aws s3api head-bucket --bucket hba-dev 2>/dev/null || aws s3 mb s3://hba-dev
        if [ -z "$$(ls -A /seed)" ]; then
          echo "WARNING: app/dev-images/ is empty, nothing uploaded. Jobs will fail with a missing input until you add photos and re-run: docker compose -f docker-compose.dev.yml up s3-seed"
          exit 0
        fi
        aws s3 cp --recursive /seed/ s3://hba-dev/src/
        aws s3 ls s3://hba-dev/src/
    restart: "no"

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    depends_on:
      redis:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development   # enables /scalar and /openapi/v1.json
      HBA_REDIS: redis:6379
    ports:
      - "8080:8080"

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    depends_on:
      redis:
        condition: service_healthy
      s3-seed:
        condition: service_completed_successfully
    environment:
      HBA_REDIS: redis:6379
      HBA_TIER: onprem
      HBA_S3_BUCKET: hba-dev
      HBA_S3_ENDPOINT_ONPREM: http://rustfs:9000
      HBA_S3_ACCESS_KEY: rustfsadmin
      HBA_S3_SECRET_KEY: rustfsadmin
    ports:
      - "8081:8080"   # /metrics and /healthz, for local inspection
    stop_grace_period: 30s   # same as the cluster; must exceed HBA_SHUTDOWN_TIMEOUT_SECONDS (§10.3)

volumes:
  rustfs-data:
