- name: Configure all hosts
  hosts: all
  become: true
  gather_facts: false
  roles:
    - common
  tags: common

- name: Configure Tailscale
  hosts: ts_routers
  become: true
  gather_facts: false
  roles:
    - tailscale
  tags: tailscale

# Right after common: CI reaches the cluster nodes through ts-gateway, so these routes
# must be in place before anything else depends on that path (docs/network.md §2.2)
- name: Configure return routes through ts-gateway
  hosts: cluster_nodes
  become: true
  gather_facts: true   # tailscale_routes_interface comes from ansible_default_ipv4
  serial: 1            # a bad netplan file can cut off only one node at a time
  roles:
    - tailscale_routes
  tags: routes

- name: Configure Docker
  hosts: docker
  become: true
  roles:
    - docker
  tags: docker

- name: Initialize Swarm
  hosts: swarm_control
  become: true
  gather_facts: false
  roles:
    - swarm
  tags: swarm

- name: Join Swarm workers
  hosts: swarm_workers
  become: true
  gather_facts: false
  roles:
    - swarm
  tags: swarm

- name: Install Node Exporter
  hosts: all
  become: true
  gather_facts: false
  roles:
    - node_exporter
  tags: node_exporter

- name: Deploy Stacks
  hosts: swarm_control
  become: true
  gather_facts: false
  roles:
    - stacks
  tags: stacks

- name: Configure cluster VIP
  hosts: swarm
  become: true
  gather_facts: true   # keepalived_interface comes from ansible_default_ipv4
  roles:
    - keepalived
  tags: keepalived

- name: Deploy observability stack
  hosts: observability
  become: true
  gather_facts: false
  roles:
    - observability
  tags: observability

# Outside both clusters, so Swarm and K8s runs share the same store (docs/app.md)
- name: Deploy object storage
  hosts: observability
  become: true
  gather_facts: false
  roles:
    - rustfs
  tags: rustfs
