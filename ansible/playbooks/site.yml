- name: Configure all hosts
  hosts: all
  become: true
  gather_facts: false
  # A VM the apply just created may still be booting or running cloud-init
  pre_tasks:
    - name: Wait for SSH
      ansible.builtin.wait_for_connection:
        timeout: 300

    # rc 2 is "done with recoverable errors" (degraded); only 1 is a real failure
    - name: Wait for cloud-init to finish
      ansible.builtin.command: cloud-init status --wait
      register: common_cloud_init
      changed_when: false
      failed_when: common_cloud_init.rc not in [0, 2]
      check_mode: false
  roles:
    - common
  tags: common

- name: Configure Tailscale
  hosts: ts_routers
  become: true
  gather_facts: false
  roles:
    - tailscale
  tags: tailscale

# CI reaches the cluster nodes through ts-gateway, so these routes
# must be in place before anything else depends on that path
- name: Configure return routes through ts-gateway
  hosts: cluster_nodes
  become: true
  gather_facts: true   # tailscale_routes_interface comes from ansible_default_ipv4
  serial: 1            # a bad netplan file can cut off only one node at a time
  roles:
    - tailscale_routes
  tags: routes

- name: Configure Docker
  hosts: docker
  become: true
  roles:
    - docker
  tags: docker

- name: Initialize Swarm
  hosts: swarm_control
  become: true
  gather_facts: false
  roles:
    - swarm
  tags: swarm

- name: Join Swarm workers
  hosts: swarm_workers
  become: true
  gather_facts: false
  roles:
    - swarm
  tags: swarm

- name: Install Node Exporter
  hosts: all
  become: true
  gather_facts: false
  roles:
    - node_exporter
  tags: node_exporter

- name: Deploy Stacks
  hosts: swarm_control
  become: true
  gather_facts: false
  roles:
    - stacks
  tags: stacks

- name: Configure cluster VIP
  hosts: swarm
  become: true
  gather_facts: true   # keepalived_interface comes from ansible_default_ipv4
  roles:
    - keepalived
  tags: keepalived

- name: Deploy observability stack
  hosts: observability
  become: true
  gather_facts: false
  roles:
    - observability
  tags: observability

# Outside both clusters, so Swarm and K8s runs share the same store (docs/app.md)
- name: Deploy object storage
  hosts: observability
  become: true
  gather_facts: false
  roles:
    - rustfs
  tags: rustfs
