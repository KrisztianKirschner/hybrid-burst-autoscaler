- name: Configure all hosts
  hosts: all
  become: true
  gather_facts: false
  roles:
    - common
  tags: common

- name: Configure Docker
  hosts: docker
  become: true
  roles:
    - docker
  tags: docker

- name: Initialize Swarm
  hosts: swarm_control
  become: true
  gather_facts: false
  roles:
    - swarm
  tags: swarm

- name: Join Swarm workers
  hosts: swarm_workers
  become: true
  gather_facts: false
  roles:
    - swarm
  tags: swarm

- name: Install Node Exporter
  hosts: all
  become: true
  gather_facts: false
  roles:
    - node_exporter
  tags: node_exporter

- name: Deploy Stacks
  hosts: swarm_control
  become: true
  gather_facts: false
  roles:
    - stacks
  tags: stacks
