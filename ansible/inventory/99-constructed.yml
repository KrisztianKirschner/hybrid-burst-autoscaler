# https://docs.ansible.com/projects/ansible-core/devel/collections/ansible/builtin/constructed_inventory.html
plugin: ansible.builtin.constructed
strict: false
groups:
  swarm: cluster == 'swarm'
  swarm_control: cluster == 'swarm' and node_role == 'control'
  swarm_workers: cluster == 'swarm' and node_role == 'worker'
  observability: node_role == 'observability'
  docker: cluster == 'swarm' or node_role == 'observability'
  # Every node of either cluster: they sit in blocks routed through ts-gateway (docs/network.md §2.2)
  cluster_nodes: cluster in ['swarm', 'k8s']
