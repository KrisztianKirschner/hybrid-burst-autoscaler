# https://docs.k3s.io/installation/configuration

- name: Check that the join token is set
  ansible.builtin.assert:
    that: k3s_token | length > 0
    fail_msg: K3S_TOKEN is not set in the environment (a secret of the proxmox GitHub environment)
    quiet: true
  # PR dry runs have no GitHub environment, so the token is empty there
  when: not ansible_check_mode

# check_mode: false so a dry run can still compare versions; a non-zero rc means not installed
- name: Read the installed k3s version
  ansible.builtin.command: /usr/local/bin/k3s --version
  register: k3s_installed
  changed_when: false
  failed_when: false
  check_mode: false

- name: Create the config directory
  ansible.builtin.file:
    path: /etc/rancher/k3s
    state: directory
    owner: root
    group: root
    mode: "0755"

# Written before the install, because the installer starts the service and it reads this on start.
# diff: false: the file holds the join token, and the CI logs are public
- name: Write the k3s config
  ansible.builtin.template:
    src: config.yaml.j2
    dest: /etc/rancher/k3s/config.yaml
    owner: root
    group: root
    mode: "0600"
  diff: false
  notify: Restart k3s

- name: Download the k3s install script
  ansible.builtin.get_url:
    url: https://get.k3s.io
    dest: /usr/local/share/k3s-install.sh
    mode: "0755"

# Runs on a fresh VM and when k3s_version changes. Server or agent comes from INSTALL_K3S_EXEC;
# the agent's server URL and token come from config.yaml
- name: Install k3s
  ansible.builtin.command: /usr/local/share/k3s-install.sh
  environment:
    INSTALL_K3S_VERSION: "{{ k3s_version }}"
    INSTALL_K3S_EXEC: "{{ 'server' if k3s_is_server else 'agent' }}"
  when: k3s_version not in k3s_installed.stdout
  changed_when: true

- name: Ensure k3s is enabled and running
  ansible.builtin.systemd_service:
    name: "{{ k3s_service }}"
    enabled: true
    state: started
  # Fresh VM + dry run: the install was only simulated, so there is no unit yet
  when: not (ansible_check_mode and k3s_installed.rc != 0)
