# https://docs.ansible.com/projects/ansible/latest/collections/community/docker/docker_stack_module.html
- name: Install Module Dependencies
  ansible.builtin.apt:
    name:
      - python3-jsondiff
      - python3-yaml
    state: present

- name: Create folder
  ansible.builtin.file:
    path: "{{ stacks_dest_dir }}"
    state: directory
    mode: '0755'
    owner: root
    group: root

- name: Copy stack files
  ansible.builtin.copy:
    src: "{{ stacks_src_dir }}"
    dest: "{{ stacks_dest_dir }}/"
    owner: root
    group: root
    mode: '0644'

- name: Check that the stack secrets are set
  ansible.builtin.assert:
    that: item.data | length > 0
    fail_msg: "{{ item.name }} is empty: RUSTFS_ACCESS_KEY / RUSTFS_SECRET_KEY not set in the environment"
    quiet: true
  loop: "{{ stacks_secrets }}"
  loop_control:
    label: "{{ item.name }}"

# https://docs.ansible.com/projects/ansible/latest/collections/community/docker/docker_secret_module.html
# Swarm secrets are immutable: new data means remove + recreate, which fails while a service uses it
- name: Create Swarm secrets
  community.docker.docker_secret:
    name: "{{ item.name }}"
    data: "{{ item.data }}"
    state: present
  loop: "{{ stacks_secrets }}"
  loop_control:
    label: "{{ item.name }}"
  no_log: true

- name: Deploy stacks
  community.docker.docker_stack:
    name: "{{ item }}"
    state: present
    prune: true
    compose:
      - "{{ stacks_dest_dir }}/{{ item }}.yml"
  loop: "{{ stacks_deploy }}"
  # Swarm configs are immutable: a content hash in the name makes every change a new config
  environment:
    PROMETHEUS_AGENT_CONFIG_VERSION: "{{ (lookup('ansible.builtin.file', stacks_src_dir ~ 'prometheus-agent.yml') | hash('sha1'))[:12] }}"
