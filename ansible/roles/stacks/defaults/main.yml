stacks_dest_dir: /opt/stacks
# Trailing slash: copy the folder's contents, not the folder itself
stacks_src_dir: "{{ playbook_dir }}/../../stacks/swarm/"

# Same keys as the rustfs role; the worker reads them as Swarm secrets
stacks_secrets:
  - name: rustfs_access_key
    data: "{{ lookup('env', 'RUSTFS_ACCESS_KEY') }}"
  - name: rustfs_secret_key
    data: "{{ lookup('env', 'RUSTFS_SECRET_KEY') }}"
  # The burst controller's AWS access key (docs/burst.md §6)
  - name: burst_aws_access_key_id
    data: "{{ lookup('env', 'BURST_CONTROLLER_AWS_ACCESS_KEY_ID') }}"
  - name: burst_aws_secret_access_key
    data: "{{ lookup('env', 'BURST_CONTROLLER_AWS_SECRET_ACCESS_KEY') }}"

# Deployed in this order: the other stacks join the overlay network the hba stack creates
stacks_deploy:
  - hba
  - monitoring
  - autoscaler
  - burst
