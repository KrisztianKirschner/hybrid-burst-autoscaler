observability_dest_dir: /opt/observability

observability_prometheus_image: "prom/prometheus:v3.15.0"
observability_grafana_image: "grafana/grafana:13.2.3"

observability_prometheus_port: 9090
observability_node_exporter_port: 9100
observability_grafana_port: 3000

# https://prometheus.io/docs/prometheus/latest/storage/
observability_retention_time: 120d
observability_retention_size: 30GB

observability_scrape_interval: 15s

observability_grafana_admin_password: "{{ lookup('env', 'GRAFANA_ADMIN_PASSWORD') }}"

# Community dashboards: downloaded unchanged from grafana.com at deploy time, not committed.
# Own dashboards are committed in files/grafana/dashboards/ instead.
# Bump: change revision + sha256 together (curl -sL <download url> | sha256sum)
observability_grafana_community_dashboards:
  - name: node-exporter-full
    id: 1860
    revision: 45
    sha256: 184c6b7409f306da75525d7772f71945b10cea23ad16b5d78c4698ea0ea51986
